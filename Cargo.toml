[workspace]
members = [".", "python"]
resolver = "3"

[package]
name = "originet"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "Map IP addresses to origin ASNs with CAIDA's RouteViews prefix-to-AS snapshots, fetched on the fly or read from a local file"
license = "MIT"
repository = "https://github.com/estcarisimo/originet"
homepage = "https://estcarisimo.github.io/originet/"
documentation = "https://estcarisimo.github.io/originet/"
readme = "README.md"
keywords = ["asn", "bgp", "caida", "routeviews", "ip"]
categories = ["command-line-utilities", "network-programming"]
authors = ["Esteban Carisimo"]
exclude = [
  "/.github",
  "/docs",
  "/python",
  "/mkdocs.yml",
  "/context7.json",
  "/Dockerfile",
  "/docker-compose.yml",
  "/deny.toml",
  "/.dockerignore",
  "/AGENTS.md",
  "/CLAUDE.md",
]

[[bin]]
name = "originet"
path = "src/main.rs"

[lib]
name = "originet"
path = "src/lib.rs"

[features]
default = ["parquet"]
# Parquet output pulls in arrow; disable it for a smaller, faster build.
parquet = ["dep:arrow", "dep:parquet"]

[dependencies]
anstream = "1.0"
anstyle = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
csv = "1.3"
directories = "6.0"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
flate2 = "1.1"
indicatif = "0.18"
ipnet = "2.11"
jiff = "0.2"
log = "0.4"
prefix-trie = { version = "0.10", default-features = false, features = ["ipnet"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
ureq = { version = "3.1", default-features = false, features = ["rustls", "gzip"] }

arrow = { version = "60", default-features = false, optional = true }
parquet = { version = "60", default-features = false, features = ["arrow", "snap"], optional = true }

[dev-dependencies]
assert_cmd = "2.0"
bytes = "1.10"
predicates = "3.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
unreadable_literal = "allow"
