name: Publish to PyPI

# Uploads the Python wheels and sdist with PyPI Trusted Publishing (OIDC).
# No API token is stored. This workflow runs only when a GitHub release is
# published, or when someone starts it from the Actions tab, so merging it
# does not upload anything. PyPI rejects the token until a trusted publisher
# for publish-pypi.yml (environment pypi) exists; see CONTRIBUTING.md.
#
# release.yml creates the GitHub release with GITHUB_TOKEN, and GitHub does
# not start other workflows from events that token creates. After that
# workflow finishes, run this one from main and pass the v* tag. The workflow
# file on main is what runs; the tag is only what gets checked out, so a tag
# cut before this file existed can still be published.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Tag matches the package version and is on main
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          case "$TAG" in
            v*) version="${TAG#v}" ;;
            *)
              echo "::error::Publish a v* tag (got ${TAG}). For a manual run, set the tag input to the release tag, for example v1.0.0."
              exit 1
              ;;
          esac
          crate=$(grep -E '^version = "' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          pycrate=$(grep -E '^version = "' python/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          pypkg=$(grep -E '^version = "' python/pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          cff=$(grep -E '^version: ' CITATION.cff | sed -E 's/version: *//')
          for v in "$crate" "$pycrate" "$pypkg" "$cff"; do
            test "$v" = "$version" || { echo "::error::tag $TAG but versions are Cargo.toml=$crate python/Cargo.toml=$pycrate pyproject=$pypkg CITATION.cff=$cff"; exit 1; }
          done
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
          echo "Publishing originet ${version} from ${TAG}" >> "$GITHUB_STEP_SUMMARY"

  wheels:
    name: wheel (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { name: macos-x86_64, os: macos-latest, target: x86_64 }
          - { name: macos-aarch64, os: macos-latest, target: aarch64 }
          - { name: windows-x86_64, os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --out dist --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/originet/
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing; no API token is stored
      actions: read # download the wheel and sdist artifacts built above
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Collect wheels and sdist
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp -t upload {} +
          ls -l upload
          test -n "$(find upload -name '*.whl' -print -quit)"
          test -n "$(find upload -name '*.tar.gz' -print -quit)"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: upload
          # A version uploaded by hand, or by a re-run, is not an error.
          skip-existing: true
