# Documentation site, published to GitHub Pages by .github/workflows/pages.yml.
# Build it with `uvx --with-requirements docs/requirements.txt mkdocs build --strict`
# (CI does on every PR). The home, changelog, contributing and citing pages include the
# files at the repository root, so the site and the README cannot drift apart.
site_name: map-ip-to-asn
site_description: Map IP addresses to origin ASNs with CAIDA's RouteViews prefix-to-AS snapshots
site_url: https://estcarisimo.github.io/map-ip-to-asn/
repo_url: https://github.com/estcarisimo/map-ip-to-asn
repo_name: estcarisimo/map-ip-to-asn
edit_uri: edit/main/docs/
copyright: MIT License. Esteban Carisimo and contributors.

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Command line: cli.md
  - Python: python.md
  - The data: data.md
  - Output formats: output.md
  - Docker: docker.md
  - Rust library: library.md
  - Changelog: changelog.md
  - Contributing: contributing.md
  - Security: security.md
  - Citing: citing.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      # Paths are relative to the repository root; a missing file fails the build
      # instead of rendering an empty page.
      base_path: ["."]
      check_paths: true

plugins:
  - search
