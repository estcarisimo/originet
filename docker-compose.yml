# docker compose run --rm map-ip-to-asn 8.8.8.8
# docker compose run --rm map-ip-to-asn --file /data/ips.txt --format csv --output /data/results.csv
# ./data on the host is /data in the container; downloads persist in the named volume.
services:
  map-ip-to-asn:
    build: .
    image: map-ip-to-asn:local
    volumes:
      - ./data:/data
      - cache:/cache

volumes:
  cache:
