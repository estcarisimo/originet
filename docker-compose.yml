# docker compose run --rm originet 8.8.8.8
# docker compose run --rm originet --file /data/ips.txt --format csv --output /data/results.csv
# ./data on the host is /data in the container; downloads persist in the named volume.
services:
  originet:
    build: .
    image: originet:local
    volumes:
      - ./data:/data
      - cache:/cache

volumes:
  cache:
